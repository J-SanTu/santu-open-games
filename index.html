<script>
const data=JSON.parse(document.getElementById('catalog-data').textContent), $=id=>document.getElementById(id);
const cats=[...new Set(data.map(x=>x.category))];let category='',active=null,imageIndex=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?u:'#';
const link=(u,t)=>u?`<a href="${esc(safe(u))}" target="_blank" rel="noopener noreferrer">${t}</a>`:'';
$('total').textContent=data.length;$('pictured').textContent=data.filter(x=>x.images.length).length;
$('coverage').textContent=`收录 ${data.length} 个条目，其中 ${data.filter(x=>x.images.length).length} 个有经过视觉筛选的画面，${data.filter(x=>!x.images.length).length} 个暂缺可靠配图。缺图不代表项目不可用。图鉴使用本地图片，断网也能浏览；源码与来源链接需要联网。`;
$('categories').innerHTML=['',...cats].map(c=>`<button class="category" data-category="${esc(c)}" aria-pressed="${!c}"><span>${esc(c||'全部游戏')}</span><span>${c?data.filter(x=>x.category===c).length:data.length}</span></button>`).join('');
$('mobileCategory').innerHTML=['',...cats].map(c=>`<option value="${esc(c)}">${esc(c||'全部分类')}</option>`).join('');
function render(){const q=$('search').value.trim().toLowerCase(),kind=$('kind').value,only=$('withImage').checked;
const found=data.filter(x=>(!category||x.category===category)&&(!kind||x.kind===kind)&&(!only||x.images.length)&&(!q||`${x.name} ${x.description} ${x.category} ${x.nature}`.toLowerCase().includes(q)));
$('sectionTitle').textContent=category||'全部游戏';$('resultCount').textContent=`${found.length} 个项目 · ${found.filter(x=>x.images.length).length} 个有图`;
document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===category));$('mobileCategory').value=category;
$('grid').innerHTML=found.length?found.map(x=>{const im=x.images[0];return `<article class="card" data-id="${x.id}">${im?`<button class="shot" data-open="${x.id}" aria-label="放大 ${esc(x.name)} 的画面"><img src="${esc(im.file)}" alt="${esc(x.name+' — '+im.type)}" loading="lazy" width="600" height="375"></button>`:`<div class="shot missing"><strong>暂未收录可靠画面</strong><span>可从下方项目入口继续查看</span></div>`}<div class="meta"><span>${esc(x.category)}</span><span class="type">${esc(x.nature)}</span></div><h3>${esc(x.name)}</h3><p class="desc">${esc(x.description)}</p><div class="links">${link(x.source,'源码 ↗')}${link(x.home,'项目网站 ↗')}${im?link(im.source,'图片来源 ↗'):''}</div>${im?`<p class="visual-note">${esc(im.type)}${x.images.length>1?' · '+x.images.length+' 张画面':''}</p>`:''}</article>`}).join(''):`<div class="empty"><h3>没有找到匹配的游戏</h3><p>试试其他名称，或重置筛选重新浏览。</p><button class="clear" data-reset>重置所有筛选</button></div>`;
$('grid').querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{const b=img.parentElement;b.outerHTML='<div class="shot missing"><strong>图片文件未能加载</strong><span>请保留 HTML 同目录下的图片文件夹</span></div>';}));}
function reset(){category='';$('search').value='';$('kind').value='';$('withImage').checked=false;render();}
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;render();}});
$('mobileCategory').addEventListener('change',e=>{category=e.target.value;render();});['search','kind','withImage'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('reset').onclick=reset;
$('grid').onclick=e=>{if(e.target.closest('[data-reset]'))return reset();const b=e.target.closest('[data-open]');if(b){active=data.find(x=>x.id===Number(b.dataset.open));imageIndex=0;updateModal();$('viewer').showModal();}};
function updateModal(){const im=active.images[imageIndex];$('modalTitle').textContent=active.name;$('modalImage').src=im.file;$('modalImage').alt=active.name+' — '+im.type;$('modalCaption').textContent=`${im.type} · ${imageIndex+1} / ${active.images.length}`;$('modalSource').href=safe(im.source);$('prev').disabled=imageIndex===0;$('next').disabled=imageIndex===active.images.length-1;}
$('close').onclick=()=>$('viewer').close();$('prev').onclick=()=>{if(imageIndex>0){imageIndex--;updateModal();}};$('next').onclick=()=>{if(imageIndex<active.images.length-1){imageIndex++;updateModal();}};
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer')){const r=$('viewer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('viewer').close();}});
$('viewer').addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});render();
</script></body></html>
